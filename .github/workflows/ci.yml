name: CI

on:
  push:
    branches:
      - main
      - feat/agentic-playground
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Lint (Maven validate)
        run: mvn -B -ntp validate

      - name: Build (skip tests)
        run: mvn -B -ntp -DskipTests package

      - name: Test
        run: mvn -B -ntp test
